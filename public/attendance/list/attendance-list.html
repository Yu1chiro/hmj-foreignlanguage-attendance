<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List attendance</title>
  <link rel="shortcut icon" href="/img/logo.webp" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@3.0.0/dist/flowbite.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer type="module" src="/attendance/services/list.js"></script>
</head>
<body class="bg-center min-h-screen bg-no-repeat bg-[url('/Sources/bg.png')] bg-gray-700 bg-blend-multiply py-32 xl:py-5 ">
  <div class="container mx-auto">
    <h1 class="text-2xl font-custom text-yellow-500 font-semibold text-center mb-6">Attendance List</h1>
    <div class="bg-white overflow-auto rounded-lg">
        <table class="min-w-full bg-white">
            <thead class="bg-gray-800 text-white">
                <tr>
                    <th class="px-4 py-2 text-center border-b">Waktu</th>
                    <th class="px-4 py-2 text-center border-b">Nama</th>
                    <th class="px-4 py-2 text-center border-b">NIM</th>
                    <th class="px-4 py-2 text-center border-b">Prodi</th>
                    <th class="px-4 py-2 text-center border-b">Semester</th>
                    <th class="px-4 py-2 text-center border-b">Status</th>
                  </tr>
            </thead>
            <tbody id="daftar-presensi" class="text-gray-700">
            </tbody>
        </table>
    </div>
  </div>
</body>
</html>
